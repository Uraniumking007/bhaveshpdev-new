name: Weekly Project Update (Fallback)

on:
  schedule:
    - cron: "0 0 * * *" # Run at 00:00 UTC every Monday
  workflow_dispatch: # Allows manual triggering

jobs:
  update-projects:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Configure alternative npm registry
        run: |
          # Try using a different registry mirror to avoid rate limiting
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 10
          npm config set fetch-retry-mintimeout 30000
          npm config set fetch-retry-maxtimeout 300000
          npm config set fetch-timeout 600000

          # Configure pnpm with more aggressive settings
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set network-timeout 600000
          pnpm config set fetch-retries 10
          pnpm config set store-dir ~/.pnpm-store

      - name: Install dependencies with multiple fallback strategies
        run: |
          # Function to try different installation strategies
          install_with_fallbacks() {
            local max_attempts=5
            local attempt=1
            local delay=15
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts to install dependencies..."
              
              # Strategy 1: Try with pnpm first
              if [ -f pnpm-lock.yaml ]; then
                echo "Trying pnpm install with lockfile..."
                pnpm install --no-frozen-lockfile --network-timeout=600000 --prefer-offline --no-optional && {
                  echo "pnpm install succeeded!"
                  return 0
                }
              fi
              
              # Strategy 2: Try with npm as fallback
              echo "Trying npm install as fallback..."
              npm install --no-optional --prefer-offline --network-timeout=600000 && {
                echo "npm install succeeded!"
                return 0
              }
              
              # Strategy 3: Try with yarn as last resort
              echo "Trying yarn install as last resort..."
              npm install -g yarn
              yarn install --network-timeout=600000 && {
                echo "yarn install succeeded!"
                return 0
              }
              
              echo "All installation methods failed on attempt $attempt"
              if [ $attempt -eq $max_attempts ]; then
                echo "All attempts failed. Exiting."
                exit 1
              fi
              
              echo "Waiting $delay seconds before retry..."
              sleep $delay
              attempt=$((attempt + 1))
              delay=$((delay * 2))  # Exponential backoff
            done
          }

          install_with_fallbacks

      - name: Sync Prisma schema
        run: |
          if command -v pnpm &> /dev/null; then
            pnpm dlx prisma db pull
          elif command -v npm &> /dev/null; then
            npx prisma db pull
          else
            yarn dlx prisma db pull
          fi

      - name: Generate Prisma Client
        run: |
          if command -v pnpm &> /dev/null; then
            pnpm dlx prisma generate
          elif command -v npm &> /dev/null; then
            npx prisma generate
          else
            yarn dlx prisma generate
          fi

      - name: Trigger API endpoint
        run: |
          response=$(curl -X GET https://bhaveshp.dev/api/v1/projects)
          echo "API Response: $response"
