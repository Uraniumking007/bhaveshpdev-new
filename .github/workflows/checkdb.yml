name: Weekly Project Update

on:
  schedule:
    - cron: '0 0 * * 1'  # Run at 00:00 UTC every Monday
  workflow_dispatch:  # Allows manual triggering

jobs:
  update-projects:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Use an appropriate Node.js version

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9  # Use the version of pnpm you're using in your project

      - name: Install dependencies
        run: |
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --no-frozen-lockfile
            else
              pnpm install
            fi

      - name: Run Prisma migrations
        run: pnpm prisma migrate deploy

      - name: Trigger API endpoint
        run: |
          response=$(curl -X GET https://bhaveshp.dev/api/v1/projects/)
          echo "API Response: $response"